name: Daily RSS Feed Update

on:
  schedule:
    # Käivitub iga päev kell 03:00 UTC (06:00 Eesti aja järgi)
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Võimaldab käivitada ka manuaalselt GitHubi veebiliidesest

permissions:
  contents: write  # Annab õiguse uuendatud failid tagasi repositooriumisse pushida

jobs:
  update-feeds:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ajalootund Scraper
      run: python scrape_ajalootund.py

    - name: Run Kuuldemang Scraper
      run: python scrape_kuuldemang.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Lisame muudetud failid otseselt
        git add feed.xml feed_kuuldemang.xml episodes_cache.json kuuldemang_cache.json
        
        # Kontrollime, kas on midagi committida
        if git diff --cached --quiet; then
          echo "Muudatusi ei leitud. Söödad on juba ajakohased."
        else
          git commit -m "Uuendatud RSS söödad: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
        fi
